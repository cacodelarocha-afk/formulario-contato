<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vamos conversar? — Caco Rocha</title>
<style>
body{margin:0;background:transparent;color:#222;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 22px}
h2{margin:0 0 8px;font-size:28px}
p{line-height:1.6;margin:0 0 26px}
.field{margin:0 0 20px}
label{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:6px;padding:13px 14px;font:inherit;background:#fff}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:6px;padding:13px 24px;background:#222;color:#fff;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h2>Vamos conversar?</h2>
<p>Se você chegou até aqui, talvez exista uma oportunidade, um projeto, uma parceria ou simplesmente uma ideia que valha uma conversa.</p>
<form action="https://formsubmit.co/cacodelarocha@gmail.com" method="POST">
<input type="hidden" name="_subject" value="Nova mensagem pelo site — Caco Rocha">
<input type="hidden" name="_template" value="table">
<div class="field"><label>Nome</label><input name="Nome" type="text" placeholder="Como posso chamar você?" required></div>
<div class="field"><label>E-mail</label><input name="E-mail" type="email" placeholder="seu@email.com" required></div>
<div class="field"><label>Motivo do contato</label><select name="Motivo do contato"><option value="">Selecione uma opção</option><option>Oportunidade profissional</option><option>Projeto / trabalho</option><option>Parceria</option><option>Networking</option><option>Outro</option></select></div>
<div class="field"><label>Mensagem</label><textarea name="Mensagem" placeholder="Escreva sua mensagem..." required></textarea></div>
<button type="submit">Enviar mensagem</button>
</form>
</div>
</body>
</html>
